services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gitam_allocator
      POSTGRES_USER: gitam
      POSTGRES_PASSWORD: gitam
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gitam:gitam@db:5432/gitam_allocator
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  postgres_data:

